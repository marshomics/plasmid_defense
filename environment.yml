# Conda environment for defense_analysis_v2. Creates a single env with all
# Python and R prerequisites. Usage:
#
#   conda env create -f environment.yml
#   conda activate defense-analysis-v2
#   pip install -e .                 # install the package itself
#   Rscript install_r_packages.R     # install the non-conda R packages
#
# Everything except phyr is in conda-forge / bioconda. phyr is CRAN-only
# and goes in via install_r_packages.R.
name: defense-analysis-v2
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.9,<3.13
  - pip
  - numpy>=1.23
  - pandas>=1.5
  - scipy>=1.10
  - statsmodels>=0.14
  - scikit-learn>=1.2
  - joblib>=1.2
  - dendropy>=4.6
  - matplotlib>=3.6
  # R + the packages that ship cleanly via conda-forge. phyr is installed
  # from CRAN in install_r_packages.R because the conda-forge build lags.
  - r-base>=4.2
  - r-ape
  - r-phylolm
  - r-phytools
  - r-caper
  - r-nlme
  - r-jsonlite
